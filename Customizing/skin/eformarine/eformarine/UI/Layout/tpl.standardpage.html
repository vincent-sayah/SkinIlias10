<!DOCTYPE html>
<html lang="{LANGUAGE}" dir="{TEXT_DIRECTION}">
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	{META_DATA}

	<!-- BEGIN for_ui_examples_only -->
	<base href="{BASE}" />
	<!-- END for_ui_examples_only -->

	<title>{VIEW_TITLE}: {SHORT_TITLE}</title>
	<link rel="icon" href="{FAVICON_PATH}" type="image/x-icon">

	<script type="application/javascript">var il = il ||{}; window.il = il;</script>

	<style>
		{CSS_INLINE}
	</style>

	<!-- BEGIN css_file -->
	<link rel="stylesheet" type="text/css" href="{CSS_FILE}" />
	<!-- END css_file -->
</head>
<body class="eformarine-ui">
	<!-- BEGIN mode_info -->
	{MODEINFO}
	<!-- END mode_info -->

	<div class="il-page-overlay">
		{OVERLAY}
	</div>

	<div class="il-layout-page eformarine-layout-page<!-- BEGIN slates_engaged --> with-mainbar-slates-engaged<!-- END slates_engaged -->" <!-- BEGIN with_id --> id="{ID}"<!-- END with_id -->>
		<div class="eformarine-topband" aria-hidden="true">
			<span>eForm Marine</span>
			<span>Former - Servir - Transmettre</span>
		</div>

		<header>
			<div class="header-inner">
				<div class="il-logo">
					<span class="hidden-xs">{LOGO}</span>
					<span class="visible-xs-block">{RESPONSIVE_LOGO}</span>
					<div class="il-pagetitle">
						{TITLE}
					</div>
				</div>

				<!-- BEGIN header_locator -->
				<nav class="il-header-locator">
					{HEADER_BREADCRUMBS}
				</nav>
				<!-- END header_locator -->
				{METABAR}
			</div>
		</header>

		<div class="il-system-infos">
			{SYSTEMINFOS}
		</div>

		<div class="nav il-maincontrols">
			{MAINBAR}
		</div>

		<main class="il-layout-page-content">
			<!-- BEGIN content_breadcrumbs -->
			<div class="breadcrumbs">
				{BREADCRUMBS}
			</div>
			<!-- END content_breadcrumbs -->

			{CONTENT}

			{FOOTER}
		</main>
	</div>

<!-- BEGIN js_file -->
<script src="{JS_FILE}"></script>
<!-- END js_file -->

<!-- BEGIN on_load_code -->
<script>
	<!-- BEGIN on_load_code_inner -->
		il.Util.addOnLoad(function() {
			{OLCODE}
		});
	<!-- END on_load_code_inner -->
</script>
<!-- END on_load_code -->

</body>
</html>
